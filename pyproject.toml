[project]
name = "origin"
version = "0.1.0"
description = "ORIGIN: an open research platform for evolutionary, open-ended and morphology-transferable intelligence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Scott Hardie", email = "scottrmhardie@gmail.com" }]
keywords = ["artificial-life", "quality-diversity", "novelty-search", "evolutionary-robotics", "reinforcement-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=14",
  "gymnasium>=0.29",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "filelock>=3.13",
  "pybullet>=3.2",
]

[project.optional-dependencies]
rl = ["torch>=2.2", "stable-baselines3>=2.3"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "playwright>=1.44", "pytest-playwright>=0.5"]

[project.scripts]
origin-run = "origin.experiments.runner:main"
origin-api = "origin.experiments.api:main"
origin-worker = "origin.experiments.worker:main"
origin-merge-stores = "origin.experiments.store:merge_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/origin"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests", "scripts", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["packages/origin"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["e2e: end-to-end browser tests (require ORIGIN_E2E=1 and running servers)", "embodied: articulated-physics tests (PyBullet DIRECT)", "integration: multi-component tests that run a real campaign end-to-end"]
