name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard — no conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed merge-conflict markers
        run: |
          set -euo pipefail
          # Match conflict-specific markers only (7 chars + space + ref) so markdown
          # '=====' underlines and docs are not false positives.
          if grep -rInE '^(<<<<<<< |>>>>>>> )' \
               --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules \
               --exclude-dir=.next --exclude-dir=dist --exclude-dir=build . ; then
            echo "::error::committed merge-conflict markers found — resolve them before pushing"
            exit 1
          fi
          echo "OK: no conflict markers"

  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    needs: [guard]
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }} --clear .venv
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Ruff (lint)
        run: .venv/bin/ruff check packages tests scripts benchmarks
      - name: Mypy (types)
        run: .venv/bin/mypy
      - name: Pytest (unit + integration)
        run: .venv/bin/python -m pytest tests -q
      - name: Deterministic smoke experiment
        run: .venv/bin/origin-run --config configs/smoke.json --store runs --jobs 2

  embodied:
    name: Embodied — PyBullet acceptance
    runs-on: [self-hosted, epyc]
    needs: [guard]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create Python environment
        run: uv venv --python 3.12 --clear .venv
      - name: Install articulated-physics dependencies
        run: uv pip install -e ".[dev,embodied]" --python .venv/bin/python
      - name: Run PyBullet regression suite
        run: .venv/bin/python -m pytest tests/test_embodied.py tests/test_embodied_eval.py tests/test_runner_embodied.py -q
      - name: Run fail-closed crawler calibration
        run: .venv/bin/python scripts/probe_embodied_morphology.py --json-out embodied-calibration.json
      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-calibration
          path: embodied-calibration.json
          if-no-files-found: error

  security:
    name: Security checks
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 --clear .venv
      - run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Secret scan (asserted properties of the tree)
        run: .venv/bin/python -m pytest tests/test_security.py -q
      - name: bandit (SAST)
        run: |
          uv pip install bandit --python .venv/bin/python
          # Gate on medium+ severity. The 8 low-severity findings (type-narrowing
          # asserts, list-form subprocess, git metadata) are documented with
          # justification in docs/VERIFICATION_REPORT.md.
          .venv/bin/bandit -q -r packages/origin -ll
      - name: pip-audit (dependency CVEs)
        run: |
          uv pip install pip-audit --python .venv/bin/python
          .venv/bin/pip-audit --progress-spinner off

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: apps/lab
        run: npm ci
      - name: Dependency audit
        working-directory: apps/lab
        run: npm run audit
      - name: Lint
        working-directory: apps/lab
        run: npm run lint
      - name: Type check
        working-directory: apps/lab
        run: npm run typecheck
      - name: Production build
        working-directory: apps/lab
        run: npm run build

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    needs: [guard, python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 --clear .venv
      - run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI deps
        working-directory: apps/lab
        run: npm ci
      - name: Seed a deterministic experiment
        run: .venv/bin/origin-run --config configs/smoke.json --store runs --jobs 2
      - name: Run browser E2E against the live API + production UI
        run: scripts/e2e_lab.sh

  gpu:
    name: GPU — CUDA smoke + PPO step (self-hosted)
    runs-on: [self-hosted, epyc]
    needs: [guard]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 --clear .venv
      - name: Install RL extra (torch + stable-baselines3)
        # The box's GPUs are sm_61 (P40) / sm_70 (V100) / sm_86 (3060).
        # Default PyPI torch (cu130) only ships sm_75+ kernels, so the V100 and
        # P40 would fail with "no kernel image". The cu126 build covers sm_50..sm_90.
        run: uv pip install -e ".[rl]" --python .venv/bin/python --torch-backend=cu126
      - name: CUDA devices
        run: |
          .venv/bin/python - <<'PY'
          import torch
          print("torch", torch.__version__, "| cuda build", torch.version.cuda)
          assert torch.cuda.is_available(), "CUDA is not available on the self-hosted runner"
          print("device_count:", torch.cuda.device_count())
          for i in range(torch.cuda.device_count()):
              print(f"  [{i}] {torch.cuda.get_device_name(i)}")
          PY
      - name: GPU matmul benchmark
        run: |
          .venv/bin/python - <<'PY'
          import time, torch
          d = torch.device("cuda:0")
          a = torch.randn(4096, 4096, device=d)
          for _ in range(3):
              _ = a @ a
          torch.cuda.synchronize()
          t0 = time.time()
          for _ in range(20):
              _ = a @ a
          torch.cuda.synchronize()
          dt = (time.time() - t0) / 20
          tflops = 2 * 4096**3 / dt / 1e12
          print(f"4096^3 matmul: {dt*1000:.1f} ms/iter  ({tflops:.1f} TFLOP/s)")
          assert tflops > 1.0, f"GPU matmul unexpectedly slow ({tflops:.2f} TFLOP/s)"
          PY
      - name: Short PPO training step on GPU
        run: |
          .venv/bin/python - <<'PY'
          import gymnasium as gym
          from stable_baselines3 import PPO
          from stable_baselines3.common.vec_env import DummyVecEnv
          env = DummyVecEnv([lambda: gym.make("CartPole-v1")])
          model = PPO("MlpPolicy", env, device="cuda", n_steps=64, batch_size=64, verbose=0)
          model.learn(total_timesteps=256)
          print("PPO train step on CUDA: OK")
          PY

