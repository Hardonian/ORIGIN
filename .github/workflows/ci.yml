name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }} --clear .venv
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Ruff (lint)
        run: .venv/bin/ruff check packages tests scripts benchmarks
      - name: Mypy (types)
        run: .venv/bin/mypy
        continue-on-error: true
      - name: Pytest (unit + integration)
        run: .venv/bin/python -m pytest tests -q
      - name: Deterministic smoke experiment
        run: .venv/bin/origin-run --config configs/smoke.json --store runs --jobs 2

  embodied:
    name: Embodied — PyBullet acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Create Python environment
        run: uv venv --python 3.12 --clear .venv
      - name: Install articulated-physics dependencies
        run: uv pip install -e ".[dev,embodied]" --python .venv/bin/python
      - name: Run PyBullet regression suite
        run: .venv/bin/python -m pytest tests/test_embodied.py tests/test_embodied_eval.py tests/test_runner_embodied.py -q
      - name: Run fail-closed crawler calibration
        run: .venv/bin/python scripts/probe_embodied_morphology.py --json-out embodied-calibration.json
      - name: Preserve calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-calibration
          path: embodied-calibration.json
          if-no-files-found: error

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 --clear .venv
      - run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Secret scan (asserted properties of the tree)
        run: .venv/bin/python -m pytest tests/test_security.py -q
      - name: bandit (SAST)
        run: |
          uv pip install bandit --python .venv/bin/python
          # Gate on medium+ severity. The 8 low-severity findings (type-narrowing
          # asserts, list-form subprocess, git metadata) are documented with
          # justification in docs/VERIFICATION_REPORT.md.
          .venv/bin/bandit -q -r packages/origin -ll
      - name: pip-audit (dependency CVEs)
        run: |
          uv pip install pip-audit --python .venv/bin/python
          .venv/bin/pip-audit --progress-spinner off

  frontend:
    name: Frontend — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: apps/lab
        run: npm ci
      - name: Production dependency audit
        working-directory: apps/lab
        run: npm run audit:production
      - name: Lint
        working-directory: apps/lab
        run: npm run lint
      - name: Type check
        working-directory: apps/lab
        run: npm run typecheck
      - name: Production build
        working-directory: apps/lab
        run: npm run build

  e2e:
    name: End-to-end browser test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12 --clear .venv
      - run: uv pip install -e ".[dev]" --python .venv/bin/python
      - name: Install Playwright Chromium
        run: .venv/bin/python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI deps
        working-directory: apps/lab
        run: npm ci
      - name: Seed a deterministic experiment
        run: .venv/bin/origin-run --config configs/smoke.json --store runs --jobs 2
      - name: Run browser E2E against the live API + production UI
        run: scripts/e2e_lab.sh
